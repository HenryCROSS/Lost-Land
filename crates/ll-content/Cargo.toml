[package]
name = "ll-content"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的存档格式与内容加载层：存档头/主体读写、schema 迁移、ContentIndex 映射表接线"

[lints]
workspace = true

[dependencies]
# 依赖方向 ll-core ← … ← ll-world ← ll-sim ← ll-mod ←
# ll-content（规格 §5）：ll-content 是依赖链最上游的消费者，只读
# ll-mod::registry::Registry（任务 2 的 ContentIndex 映射表接线）与
# ll-core::ident（NamespacedId 解析），不得被 ll-world/ll-sim/ll-mod
# 反向依赖。
ll-core = { path = "../ll-core", features = ["serde"] }
# 任务 2 新增：content_index_map 模块需要真正读写 Registry。
ll-mod = { path = "../ll-mod" }
# 任务 4 新增：world_identity 模块需要 ZoneLayout/WorldError（推荐预设
# 与 validate_size_choice）。依赖方向 ll-world ← … ← ll-mod ← ll-content
# （规格 §5）本就允许——ll-content 是依赖链最上游的消费者，ll-mod 自己
# 也已经直接依赖 ll-world（见其 Cargo.toml 同款说明），这里显式列出
# 而不是只靠 ll-mod 传递访问，是因为 world_identity.rs 直接引用
# `ll_world` 的类型，显式依赖让这层引用一目了然。
ll-world = { path = "../ll-world" }
# 任务 9 新增：读档流程需要 rebuild_all_engines_after_load/rebuild_count
# 强制重建脚本引擎（约束 C1 修订版：VM 必须可随时从零重建）。依赖方向
serde = { version = "1", features = ["derive"] }
# 存档头是明文 JSON（规格 §11.2「存档列表界面只读头部」，见 header.rs
# 模块文档）——header 与 migration 框架本身用它做序列化往返测试。
serde_json = "1"
# 存档主体编码，规格 §11.2 指定。本任务（task 1/2）只搭骨架，不接入
# 真实读写（那是任务 9），这里先声明依赖并核实
# `cargo deny check` 许可证扫描通过，机制留给任务 9 落地。
#
# 显式关闭默认 feature：postcard 的 `default = ["heapless-cas"]` 会拉入
# `heapless`，其依赖链上的 `atomic-polyfill` 触发 `cargo deny check`
# 的 unmaintained 公告（RUSTSEC-2023-0089，见
# knowledge/licenses/2026-08-19-ll-content-postcard-lz4-scan.md）。本
# 项目是纯桌面应用，不需要 `heapless` 面向的 no_std 场景，改用
# `use-std`（`serde/std` + `alloc`）即可拿到 `to_allocvec`/`from_bytes`
# 这类基于 `Vec`/`std` 的 API，同时彻底避开这条依赖链。
postcard = { version = "1", default-features = false, features = ["use-std"] }
lz4_flex = "0.11"

[dev-dependencies]
proptest.workspace = true
# 任务 13（验收 demo）新增，2026-08-29 批次 13 后由
# `tests/save_acceptance.rs`/`tests/gameplay_acceptance.rs` 继承：
# 那两条回归需要证明「脚本状态写入经
# Effect::SetScriptState → apply 这条唯一入口是否真的被
# WorldState::hash() 正确捕捉」（P5 计划验收纪律点 a），这要求直接
# 调用 ll_sim::apply::apply/ll_sim::effect::Effect 与
# ll_sim::intent/resolve（走一遍真实的 Intent → resolve → Effect →
# apply 链路，而不是绕过去直接改字段）。依赖方向规格 §5 允许——
# ll-content 已经直接依赖 ll-world，它排在 ll-sim
# 的前后两侧，新增这一条不反转任何箭头。只在 tests 里使用，
# 放 dev-dependencies 不进入生产依赖图（不影响
# `cargo tree -p ll-world | grep ll-sim` 这条既有验证）。
ll-sim = { path = "../ll-sim" }
