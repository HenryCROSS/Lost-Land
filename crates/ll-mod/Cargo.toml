[package]
name = "ll-mod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的 mod 框架核心：发现、清单解析、依赖拓扑排序、内容注册表、mod 集合双记录"

[lints]
workspace = true

[dependencies]
# 依赖方向 ll-world ← ll-sim ← ll-script ← ll-mod（规格 §5）：ll-mod 是
# 最上游的消费者，只应依赖更底层的 crate，绝不能被 ll-world/ll-sim/
# ll-script 反过来依赖。本批（Task 6/7/9）只依赖 ll-core
# （NamespacedId/ContentIndex/Interner/StateHasher）。
ll-core = { path = "../ll-core" }
# Task 8 新增：本体地形迁入注册表——`crate::base_terrain` 需要
# `ll_world::terrain` 的 `TerrainDef`/`TerrainTable`/`BaseTerrainIds`/
# `materialize_base_terrain` 才能把「已经拿到的 Registry」与「地形该
# 长什么样」接起来。`ll-mod` 在依赖顺序的最上游，依赖 `ll-world` 不
# 违反方向（`ll-world` 本身不认识、也不依赖 `ll-mod`，见
# `ll_world::terrain` 模块文档「与 Registry 的关系」）。
ll-world = { path = "../ll-world" }
# Task 11 新增：加载管线要真正跑到「加载脚本」这一步（发现→解析清单→
# 拓扑排序→加载脚本→注册内容→交叉引用校验，规格 §10.6），需要驱动
# `ll_script::host::ScriptEngine`。依赖方向 ll-script ← ll-mod（规格
# §5）本就允许——`ll-script` 不认识、也不依赖 `ll-mod`。
ll-script = { path = "../ll-script" }
# mod 清单格式：JSON5（项目所有者 2026-08-20 裁定「全用 json5 吧,
# 还可以写注释方便日后维护」，统一本仓库全部手写配置格式；此前的
# TOML 假设见提交历史）。`json5` crate 只做解析，不提供序列化，但
# JSON 是 JSON5 的严格子集——手写文件（`mod.json5`）享受注释/尾逗号，
# 由本 crate 生成的 JSON（若将来出现）继续用 `serde_json` 写出即可,
# 两边统一走 `json5::from_str` 读取,不需要维护两套解析器。
serde = { version = "1", features = ["derive"] }
json5 = "1.3.1"
# 资产 VFS（`crate::asset_vfs`）解析 mod 自带的 `assets/sprites/manifest.json5`
# ——从 [dev-dependencies] 升级为生产依赖：此前只有测试用它验证存档
# 序列化往返，现在装载管线本身在生产代码路径上要解析这份 JSON5。
serde_json = "1"
# `crate::asset_vfs` 对路径穿越、清单解析失败等非致命问题记警告日志
# （「降级而非崩溃」），与 `ll-render`/`ll-game` 使用的是同一个门面。
tracing = "0.1"
# P5-B 接线批次：从 [dev-dependencies] 升级为生产依赖。原先只在测试里
# 用它验证「写入没有绕开 apply」（见下方历史注释），但 `resolve_use_skill`/
# `Intent::Attack` 的击杀结算需要在真实游玩流程里查询本 crate 的
# `SkillTable`/`QuestTable`——这要求 `SkillTable`/`QuestTable` 分别实现
# `ll_sim::skill::SkillCatalog`/`ll_sim::quest::QuestCatalog`（依赖倒置，
# 见 `crate::skill`/`crate::quest` 模块文档），trait 定义在 `ll-sim`，
# 实现它必须先能看见它的类型签名，因此本 crate 现在需要在生产代码
# （非 `#[cfg(test)]`）里 `use ll_sim::...`。依赖方向
# ll-world ← ll-sim ← ll-script ← ll-mod（规格 §5）本就允许 `ll-mod`
# 依赖 `ll-sim`（更下游）——`ll-sim` 不认识、也不依赖 `ll-mod`，
# `cargo tree -p ll-world | grep ll-sim` 这条既有验证不受影响。
ll-sim = { path = "../ll-sim" }
# 等级与经验系统落地批次：从 [dev-dependencies] 升级为生产依赖。原先
# 只有测试直接构造/比较 `SteelVal`（见下方历史注释），但
# `crate::script_xp_curve_api` 的 `register-xp-curve` 需要在生产代码
# 路径上把表达式参数声明成 `SteelVal` 类型本身（`(quote 表达式)` 交给
# Rust 函数的就是这棵未求值的树，见该模块文档「为什么表达式参数的
# Rust 类型是 SteelVal」一节），不能像其余 `register-*` 函数那样单靠
# `register_fn` 的泛型自动转换绕开这个类型名。
steel-core = "0.8.2"
# 动画剪辑接线批次新增：`crate::clip`/`crate::base_clip` 需要
# `ll_render::anim::Clip`（剪辑数据本身的类型）与
# `ll_render::anim::base_hero_clips`（本体英雄行走/待机剪辑的唯一权威
# 定义，见其文档「为什么这份内容放在机制 crate 里」）。依赖方向
# `ll-render` ← `ll-world` ← `ll-sim` ← `ll-script` ← `ll-mod`（规格
# §5）本就允许——`ll-render` 只依赖 `ll-core`/`ll-platform`，不认识、
# 也不依赖 `ll-mod`，不构成环。
ll-render = { path = "../ll-render" }

[dev-dependencies]
proptest.workspace = true
# `steel-core` 已在等级与经验系统落地批次升级为生产依赖（见上方
# [dependencies] 的注释），测试代码沿用同一份，不再单独声明。
