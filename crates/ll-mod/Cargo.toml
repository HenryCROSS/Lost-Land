[package]
name = "ll-mod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的 mod 框架核心：发现、清单解析、依赖拓扑排序、内容注册表、mod 集合双记录"

[lints]
workspace = true

[dependencies]
# 依赖方向 ll-world ← ll-sim ← ll-script ← ll-mod（规格 §5）：ll-mod 是
# 最上游的消费者，只应依赖更底层的 crate，绝不能被 ll-world/ll-sim/
# ll-script 反过来依赖。本批（Task 6/7/9）只依赖 ll-core
# （NamespacedId/ContentIndex/Interner/StateHasher）。
ll-core = { path = "../ll-core" }
# Task 8 新增：本体地形迁入注册表——`crate::base_terrain` 需要
# `ll_world::terrain` 的 `TerrainDef`/`TerrainTable`/`BaseTerrainIds`/
# `materialize_base_terrain` 才能把「已经拿到的 Registry」与「地形该
# 长什么样」接起来。`ll-mod` 在依赖顺序的最上游，依赖 `ll-world` 不
# 违反方向（`ll-world` 本身不认识、也不依赖 `ll-mod`，见
# `ll_world::terrain` 模块文档「与 Registry 的关系」）。
ll-world = { path = "../ll-world" }
# Task 11 新增：加载管线要真正跑到「加载脚本」这一步（发现→解析清单→
# 拓扑排序→加载脚本→注册内容→交叉引用校验，规格 §10.6），需要驱动
# `ll_script::host::ScriptEngine`。依赖方向 ll-script ← ll-mod（规格
# §5）本就允许——`ll-script` 不认识、也不依赖 `ll-mod`。
ll-script = { path = "../ll-script" }
# mod 清单格式选 TOML（本任务的实现假设，理由见 task-6-brief.md：
# 与规格 §11.1「用户设置 TOML」同类场景，且不需要先起 Steel VM 就能
# 解析出依赖关系用于拓扑排序）。
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# P5-B 接线批次：从 [dev-dependencies] 升级为生产依赖。原先只在测试里
# 用它验证「写入没有绕开 apply」（见下方历史注释），但 `resolve_use_skill`/
# `Intent::Attack` 的击杀结算需要在真实游玩流程里查询本 crate 的
# `SkillTable`/`QuestTable`——这要求 `SkillTable`/`QuestTable` 分别实现
# `ll_sim::skill::SkillCatalog`/`ll_sim::quest::QuestCatalog`（依赖倒置，
# 见 `crate::skill`/`crate::quest` 模块文档），trait 定义在 `ll-sim`，
# 实现它必须先能看见它的类型签名，因此本 crate 现在需要在生产代码
# （非 `#[cfg(test)]`）里 `use ll_sim::...`。依赖方向
# ll-world ← ll-sim ← ll-script ← ll-mod（规格 §5）本就允许 `ll-mod`
# 依赖 `ll-sim`（更下游）——`ll-sim` 不认识、也不依赖 `ll-mod`，
# `cargo tree -p ll-world | grep ll-sim` 这条既有验证不受影响。
ll-sim = { path = "../ll-sim" }

[dev-dependencies]
proptest.workspace = true
# 序列化往返测试（任务 7 的存档一致性验证）与 `ll-world` 的同类测试
# 用同一个编码格式。
serde_json = "1"
# 规格 §10.5 接线批次新增：`script_behavior_api`/`script_behavior_source`
# 的测试要直接断言 `ScriptEngine::call_raw` 的返回值（`steel::rvals::
# SteelVal`）——生产代码本身不需要点名这个类型（`register_fn` 靠泛型
# 转换，见 `ll-script` 既有模式），只有测试需要构造/比较具体的
# `SteelVal` 值，因此只加进 dev-dependencies，不升级成生产依赖。版本
# 与 `ll-script`/`Cargo.lock` 锁定的一致。
steel-core = "0.8.2"
