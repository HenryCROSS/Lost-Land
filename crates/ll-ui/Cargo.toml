[package]
name = "ll-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的游戏内 UI：本阶段（P4）范围限定为加载管理界面——mod 管理器与脚本错误控制台的合体（规格 §10.6）"

[lints]
workspace = true

[dependencies]
# 依赖方向 ll-core ← ll-render/ll-text ← ll-world ← ll-sim ← ll-script ←
# ll-mod ← ll-ui（规格 §5，裁定 P4-1）：ll-ui 是依赖链最下游的消费者，
# 本阶段只用得到 ll-mod 产出的 LoadReport 与 ll-text 的文本渲染地基，
# 不直接依赖 ll-world/ll-sim/ll-script/ll-render——需要它们的类型时都
# 是通过 ll-mod/ll-text 已经重新导出或转换过的形式拿到，不重复建立
# 平行依赖。
ll-core = { path = "../ll-core" }
ll-mod = { path = "../ll-mod" }
ll-text = { path = "../ll-text" }
# P7 第一批（只读观测界面）新增：状态栏/角色面板/背包/装备栏需要读
# `ll_world::entity::Agent`（生命/法力/背包/装备/生效中的属性修正）、
# `ll_sim::resolve::derive_stats`（烘焙+装备+buff 之后的有效属性值，不
# 是裸 `BaseStats`）与 `ll_core::time`（世界时钟换算）——按本 crate 顶层
# 文档「依赖方向」一节，`ll-world`/`ll-sim` 本就排在 `ll-ui` 的上游，
# P4 阶段的加载管理界面只是恰好用不到它们，不代表这两条依赖不允许存在。
ll-world = { path = "../ll-world" }
ll-sim = { path = "../ll-sim" }
# `Catalog::resolve` 把属性名/槽位名/物品名的 `_key` 字段解析成真实
# 显示文本——规格 §11.3 要求用户可见文本一律走 i18n，本批次是
# `display_name_key` 系列字段第一个大规模消费者，见任务书「数据从哪来」
# 一节。
ll-i18n = { path = "../ll-i18n" }
# `render_load_report` 的签名接收 `wgpu::Device`/`Queue`/`TextureView`
# （`TextRenderer::render` 本身要求原生分辨率下的这三个原语，见
# ll-text 文档）——走 ll-render 重新导出的 wgpu，不额外声明一份独立的
# `wgpu = "30"`，理由与 ll-text/ll-sim 等既有 crate 一致：多一份独立
# 声明就多一个版本漂移导致「同名不同类型」编译错误的风险点。
ll-render = { path = "../ll-render" }
# TextRun::color 的类型是 glyphon::Color；这里直接依赖 glyphon 而不是
# 让 ll-text 重新导出它，理由与 ll-render 重新导出 wgpu 不同——
# glyphon::Color 只是一个纯数据的 RGBA 元组结构，不像 wgpu 的类型那样
# 牵扯设备/队列生命周期，两处各自声明同一个版本不会有「同名不同类型」
# 的风险（cargo 按版本+来源去重，两处声明相同版本号解析到同一份）。
glyphon = "0.12"
# `widget::quad::QuadInstance` 要按字节原样搬进 GPU 实例缓冲，理由与
# `ll_render::batch::SpriteInstance` 一致——版本与 `ll-render` 保持一致
# 避免同名不同类型的解析分裂。
bytemuck = { version = "1.25", features = ["derive"] }
# HUD 渲染失败（例如文本渲染错误）只记日志、不 panic，理由与
# `ll-game::app` 既有的降级纪律一致——见 `crates/ll-ui/src/hud/render.rs`
# 的 `render_hud`。
tracing = "0.1"
# P7 交互层批次新增：光标位置/鼠标按键/`InputContext`（`ll_platform::input`/
# `ll_platform::keybind`）是命中测试、按钮控件、`UiModeStack` 的直接
# 输入——此前只在 `[dev-dependencies]` 供 p4_acceptance 验收 demo 使用，
# 现在升级为真实产品依赖。这不是新开一条依赖边——总纲设计规格 §5 的
# 权威依赖顺序本就是 `ll-core ← ll-platform/ll-render/ll-audio ← ll-text
# ← ll-world ← ll-sim ← ll-script ← ll-mod ← ll-content ← ll-ui`
# （`ll-platform` 本就排在 `ll-ui` 上游），本 crate 顶层文档「依赖方向」
# 一节此前的表述只是 P4 阶段恰好用不到 `ll-platform` 而已，不代表这条
# 依赖不允许存在，与上面 `ll-world`/`ll-sim` 那条注释是同一个道理。
ll-platform = { path = "../ll-platform" }

[dev-dependencies]
proptest.workspace = true
# 仅供 p4_acceptance 验收 demo 使用：加载管理界面本身不依赖世界层/
# 脚本层（分层约束见本 crate 顶层文档），但验收 demo 要把「mod 目录
# -> 加载管线 -> 注册表 -> 世界地形 -> 屏幕」这条完整链路真正跑起来，
# 属于开发期验证工具而非产品代码，因此放在 dev-dependencies——不会
# 传染给依赖 ll-ui 的下游 crate（P4 阶段 ll-ui 还没有下游）。与
# ll-sim 的 p3_acceptance 同样的取舍，见其 Cargo.toml。
ll-core = { path = "../ll-core", features = ["serde"] }
ll-script = { path = "../ll-script" }
# ll-sim/ll-world 本身已经是 [dependencies] 的真实依赖（P7 第一批新增，
# 见上方说明），这里不再重复声明——demo 仍然只用得到 P3 验收过的
# Move/Wait 两种 Intent，不需要时间轴/AI。
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "p4_acceptance"
# 默认 examples 的 test = false：cargo test --workspace 只保证它能编译，
# 不会跑里面的 #[test]。这个 demo 里的世界搭建、加载报告展示等纯函数
# 逻辑值得被 `cargo test --workspace` 真正覆盖，而不只是编译检查——与
# p1/p2/p3_acceptance 同样的理由。
test = true
