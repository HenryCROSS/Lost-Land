[package]
name = "ll-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的渲染层：wgpu 精灵批渲染、图集、相机、图层、Y 排序"

[lints]
workspace = true

[dependencies]
ll-core = { path = "../ll-core" }
ll-platform = { path = "../ll-platform" }
wgpu = "30"
bytemuck = { version = "1.25", features = ["derive"] }
# 只启用 PNG：图集是我们自己资产管线的产物，格式由我们决定，
# 没必要为此把 JPEG/GIF/TIFF 等一整套解码器编进来。
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
proptest.workspace = true

# 默认 examples 的 test = false：cargo test --workspace 只保证它们能编译，
# 不会跑里面的 #[test]。这个 demo 里的 UV 换算、棋盘格、Y 排序平局等
# 逻辑值得被 `cargo test --workspace` 真正覆盖，而不只是编译检查。
[[example]]
name = "p1_acceptance"
test = true
