[package]
name = "ll-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的回合与模拟层：时间轴调度器、Intent/Effect/Apply 管线、战斗结算（占位）"

[lints]
workspace = true

# 实体存储与名字生成已迁移到 ll-world（依赖方向修正，见规格 §5：
# ll-world ← ll-sim，状态所在的 crate 不能反过来依赖演化所在的
# crate）。timeline/effect/apply 需要读 &WorldState（地形、FOV 等定义
# 在 ll-world），故依赖 ll-world；ll-core/serde 是 Tick/DetRng/EntityId
# 等类型一贯需要的基础设施。
#
# ll-platform 是 Task 4 新增的依赖：`intent_from_input` 要把玩家一帧的
# 按键状态（`ll_platform::input::InputState`）映射成 `Intent`，这个
# 映射规则天然属于「演化」层而不是平台层——按键含义会随玩法调整，
# 平台层只管把操作系统事件归约成 `GameKey`，不该关心这些键在游戏里
# 意味着什么。依赖方向 ll-platform ← ll-sim 不成环：ll-platform 只依赖
# ll-core，不认识 ll-sim。
[dependencies]
ll-core = { path = "../ll-core", features = ["serde"] }
ll-platform = { path = "../ll-platform" }
ll-world = { path = "../ll-world" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
# 仅用于 serde 往返测试：验证类型能经过一种真实的 serde 格式完整
# 往返，而不只是停留在 derive 能编译这一层面（与 ll-core/ll-world
# 同样的理由，见其 Cargo.toml）。
serde_json = "1"
# 仅供 p3_acceptance 验收 demo 使用：模拟层本身不依赖渲染/平台层
# （分层约束见本 crate 顶层文档），但验收 demo 要把 Intent → resolve →
# Effect → apply → 时间轴这条链路真正画到屏幕上，属于开发期验证工具而
# 非产品代码，因此放在 dev-dependencies——不会传染给依赖 ll-sim 的下游
# crate。与 `ll-world` 的 `p2_acceptance` 同样的取舍，见其 Cargo.toml。
ll-render = { path = "../ll-render" }
image = { version = "0.25", default-features = false, features = ["png"] }
# 仅供 p3_acceptance 使用：demo 沿用 ll-render/ll-world 既有 demo 的
# 结构化日志纪律（窗口生命周期、GPU 资源缺失等按结构化字段记录），
# 本 crate 的库代码本身不需要日志，故放在 dev-dependencies。
tracing = "0.1"

[[example]]
name = "p3_acceptance"
# 默认 examples 的 test = false：cargo test --workspace 只保证它能编译，
# 不会跑里面的 #[test]。这个 demo 里的回合引擎、AI 路由、字体栅格化等
# 纯函数逻辑值得被 `cargo test --workspace` 真正覆盖，而不只是编译检查
# ——与 `ll-world` 的 `p2_acceptance`、`ll-render` 的 `p1_acceptance`
# 同样的理由。
test = true

[[example]]
name = "p5_coordinate_acceptance"
# 两级坐标系重写（任务 15）的验收 demo，宿主选在本 crate 而非
# `ll-world`：需要 Intent → resolve → Effect → apply 这条链路
# （进出 Interior、EnterSpace/ExitSpace 都要走它，见 ll-sim::resolve
# 任务 12），`ll-world` 没有这些类型；本 crate 已经具备
# ll-render/ll-platform 两个 dev-dependency（p3_acceptance 已经在用），
# 不需要为此新引入依赖或换一个尚不存在的 crate（ll-app）。
test = true
