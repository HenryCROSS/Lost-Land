[package]
name = "ll-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的回合与模拟层：时间轴调度器、Intent/Effect/Apply 管线、战斗结算（占位）"

[lints]
workspace = true

# 实体存储与名字生成已迁移到 ll-world（依赖方向修正，见规格 §5：
# ll-world ← ll-sim，状态所在的 crate 不能反过来依赖演化所在的
# crate）。timeline/effect/apply 需要读 &WorldState（地形、FOV 等定义
# 在 ll-world），故依赖 ll-world；ll-core/serde 是 Tick/DetRng/EntityId
# 等类型一贯需要的基础设施。
#
# ll-platform 是 Task 4 新增的依赖：`intent_from_input` 要把玩家一帧的
# 按键状态（`ll_platform::input::InputState`）映射成 `Intent`，这个
# 映射规则天然属于「演化」层而不是平台层——按键含义会随玩法调整，
# 平台层只管把操作系统事件归约成 `GameKey`，不该关心这些键在游戏里
# 意味着什么。依赖方向 ll-platform ← ll-sim 不成环：ll-platform 只依赖
# ll-core，不认识 ll-sim。
[dependencies]
ll-core = { path = "../ll-core", features = ["serde"] }
ll-platform = { path = "../ll-platform" }
ll-world = { path = "../ll-world" }
serde = { version = "1", features = ["derive"] }
# `turn::TurnEngine::advance_ai` 在单次调用达到 MAX_STEPS_PER_ADVANCE
# 仍未轮到受控实体时记一条结构化错误日志——这是「必须保证进展」这道
# 防线被真正触发时唯一能看见的信号（见该方法文档），不是可选的开发期
# 工具，故属于 [dependencies] 而非 [dev-dependencies]：`ll-game`（生产
# 二进制）要调用这个方法。
tracing = "0.1"

[dev-dependencies]
proptest.workspace = true
# 仅用于 serde 往返测试：验证类型能经过一种真实的 serde 格式完整
# 往返，而不只是停留在 derive 能编译这一层面（与 ll-core/ll-world
# 同样的理由，见其 Cargo.toml）。
serde_json = "1"
# 2026-08-29 批次 13：`ll-render` 与 `image` 两条 dev-dependency 随
# `p3_acceptance` 一并移除——它们此前的唯一用途是那个 demo 的开窗渲染
# 与截图落盘。搬进 `tests/coordinate_layers_e2e.rs` 的九条断言全程不碰
# 渲染层（见该文件模块文档与
# `knowledge/decisions/0030-remove-examples-acceptance-demos.md`），
# 模拟层因此回到「不依赖渲染/平台层」这条分层约束的干净状态。
