[package]
name = "ll-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的纯数据基础层：环面坐标、确定性随机、命名空间标识、世界时间"

# ll-core 默认零运行时依赖。它被所有其他 crate 依赖，任何强制引入的
# 依赖都会传染给整个项目。`serde` 是唯一例外，且以 `optional = true`
# 的可选依赖形式存在：不开启 `serde` feature 就不会被编译进来，因此
# 不违反上述约束——开启方（如 ll-world，为了让 WorldState 完整可
# 序列化）自行承担这份依赖成本。
[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "torus"
harness = false
# criterion 自带 harness，若不关掉 test 目标，`cargo test --all-targets`
# 会把完整基准当测试跑一遍，把分钟级门禁拖成十分钟级。
test = false
