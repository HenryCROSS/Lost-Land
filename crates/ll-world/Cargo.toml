[package]
name = "ll-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的世界层：世界状态、环面地形、视野、昼夜四季"

[lints]
workspace = true

[dependencies]
# 开启 ll-core 的可选 serde feature：WorldState 需要 Tick 与 TorusSize
# 可序列化才能完整往返（见 ll-core/Cargo.toml 顶部对该 feature 的说明）。
ll-core = { path = "../ll-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# 脚本状态存储（knowledge/design/script-state-storage.md 六节）的配额
# 判定需要「按存档同款编码估算序列化后大小」——postcard 正是存档主体
# 用的编码（ll-content 已依赖，见 knowledge/licenses/2026-08-19-ll-content-postcard-lz4-scan.md
# 的许可扫描记录），这里复用同一个编码而不是发明另一套估算方式，
# 使配额数字与真实落盘大小同源。关闭默认 feature 理由与 ll-content
# 相同：`heapless-cas` 默认 feature 会拉入不需要的额外依赖。
postcard = { version = "1", default-features = false, features = ["use-std"] }

[dev-dependencies]
proptest.workspace = true
# Task 8（TerrainKind 迁入注册表）新增：ADR 0017 要求「迁完之后不得
# 变慢」必须用真实基准数据核实，不能靠直觉判断数组访问理应比 match
# 快——见 benches/terrain.rs。
criterion.workspace = true
# 仅用于序列化往返测试：验证 WorldState 能经过一种真实的 serde 格式
# 完整往返，而不只是停留在 derive 能编译这一层面。
serde_json = "1"
# 2026-08-29 批次 13：`ll-render`/`ll-platform`/`image` 三条
# dev-dependency 随 `p2_acceptance` 一并移除——它们此前的唯一用途是那个
# demo 的开窗渲染与截图落盘。世界层因此回到「不依赖渲染/平台层」这条
# 分层约束的干净状态（见
# `knowledge/decisions/0030-remove-examples-acceptance-demos.md`）。

[[bench]]
name = "terrain"
harness = false
# criterion 自带 harness，若不关掉 test 目标，`cargo test --all-targets`
# 会把完整基准当测试跑一遍，拖慢门禁——与 ll-core 的 torus 基准同样的
# 理由，见其 Cargo.toml。
test = false
