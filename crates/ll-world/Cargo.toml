[package]
name = "ll-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的世界层：世界状态、环面地形、视野、昼夜四季"

[lints]
workspace = true

[dependencies]
# 开启 ll-core 的可选 serde feature：WorldState 需要 Tick 与 TorusSize
# 可序列化才能完整往返（见 ll-core/Cargo.toml 顶部对该 feature 的说明）。
ll-core = { path = "../ll-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
proptest.workspace = true
# 不声明 criterion：本 crate 没有 benches/ 目录，声明了也不会被用到。
# ll-core 的 torus 基准（crates/ll-core/benches/torus.rs）已经覆盖了
# 环面坐标运算的性能回归，本 crate 目前没有独立的性能敏感路径需要
# 单独立基准——真出现性能问题时再补 benches/ 与这条依赖，而不是先占位。
# 仅用于序列化往返测试：验证 WorldState 能经过一种真实的 serde 格式
# 完整往返，而不只是停留在 derive 能编译这一层面。
serde_json = "1"
# 仅供 p2_acceptance 验收 demo 使用：世界层本身不依赖渲染/平台层
# （分层约束见本 crate 顶层文档），但验收 demo 需要把 ll-world 产出的
# 真实地形画到屏幕上，属于开发期验证工具而非产品代码，因此放在
# dev-dependencies——不会传染给依赖 ll-world 的下游 crate。
ll-render = { path = "../ll-render" }
ll-platform = { path = "../ll-platform" }
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "p2_acceptance"
# 默认 examples 的 test = false：cargo test --workspace 只保证它能编译，
# 不会跑里面的 #[test]。这个 demo 里的地形映射、出生点搜索、光照色调
# 等纯函数逻辑值得被 `cargo test --workspace` 真正覆盖，而不只是编译
# 检查（与 ll-render 的 p1_acceptance 同样的理由，见其 Cargo.toml）。
test = true
