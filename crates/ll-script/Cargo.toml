[package]
name = "ll-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的脚本宿主层：Steel VM 封装、内存守卫、mod API 表面"

# 本 crate 不能用 `[lints] workspace = true`（Cargo 硬性限制：一旦声明
# `workspace = true`，同一个 `[lints]` 表里不允许再出现任何覆盖项，
# 实测报错 "cannot override `workspace.lints` in `lints`"）。而
# `ScriptAllocGuard`（任务 4）必须 `unsafe impl GlobalAlloc`，这是
# Steel 原生缺失内存守卫（ADR 0001「缺口」一节）的唯一对策，标准库
# 没有安全替代 API；`forbid` 级别的 lint 无法用 `#[allow]` 局部覆盖
# （E0453，即使在同一 crate 内也不行），所以本 crate 只能不继承
# 工作区的 `unsafe_code = "forbid"`。为了不因此丢失其余工作区约束，
# 手工镜像 `missing_docs = "warn"`，仅 `unsafe_code` 单独放宽为
# `allow`，放宽范围仅限本 crate。
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[dependencies]
# 依赖方向 ll-world ← ll-sim ← ll-script（规格 §5）：query.rs 需要读
# `ll_world::WorldState`（地形/光照等只读查询），intent.rs 需要产出
# `ll_sim::Intent`/`Effect`（脚本不直接改世界，只产出数据交给
# `ll_sim::apply::apply` 这一唯一写入口）。ll-sim 已经依赖 ll-world，
# 这里两个都显式列出而不是只依赖 ll-sim 再传递访问 WorldState，是因为
# query.rs 直接引用 `ll_world` 的类型，显式依赖让这层引用一目了然。
ll-core = { path = "../ll-core" }
ll-sim = { path = "../ll-sim" }
ll-world = { path = "../ll-world" }
steel-core = "0.8.2"

[dev-dependencies]
proptest.workspace = true
# 仅用于脚本状态存储的孤儿保留测试：验证 WorldState 经过一种真实的
# serde 格式完整往返后，读档时脚本状态原样保留——与 ll-world 自己的
# 序列化往返测试同一个理由（见其 Cargo.toml 对应注释）。
serde_json = "1"
