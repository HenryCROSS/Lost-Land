[package]
name = "ll-game"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "迷途大陆的游戏本体二进制：把六个验收 demo 各自证明过的零件（窗口、渲染、世界、战斗、UI、坐标）装成一台整机——启动、装载内容、建世界/读档、游玩、存档、退出。"

[lints]
workspace = true

# 依赖方向规格 §5：ll-core ← … ← ll-world ← ll-sim ← ll-mod
# ← ll-content ← ll-ui。本体二进制排在依赖链的最下游，六个上游 crate
# 全部需要——它是唯一把它们全部串起来的地方，没有任何一个更下游的
# crate 反过来依赖它（它本身就是这条依赖链的终点，除了未来的
# ll-ui 完整控件库，见规格 §15 P7）。
[dependencies]
ll-content = { path = "../ll-content" }
ll-core = { path = "../ll-core" }
# 本地化查表——本体二进制是唯一同时认识 ll-platform（要设置窗口标题）
# 与 ll-i18n（要解析标题该显示什么文字）两边的地方，接线自然落在这里。
# 见 crate::run_game 里 window_config.resolved_title 的赋值。
ll-i18n = { path = "../ll-i18n" }
ll-mod = { path = "../ll-mod" }
ll-platform = { path = "../ll-platform" }
ll-render = { path = "../ll-render" }
ll-sim = { path = "../ll-sim" }
ll-world = { path = "../ll-world" }
# P7 第一批（只读观测 HUD：状态栏/角色面板/背包/装备栏）——本体二进制
# 是唯一同时持有真实 `WorldState`/`Agent`、真实内容表（`ItemTable`）、
# 真实 GPU 设备与真实本地化 `Catalog` 的地方，接线自然落在这里，见
# `crate::app::draw_hud`。
ll-ui = { path = "../ll-ui" }
# `GpuResources::text_renderer` 的类型是 `ll_text::TextRenderer`——
# `ll-ui` 已经依赖 `ll-text`，这里直接依赖而不是等 `ll-ui` 重新导出，
# 理由与本体二进制既有的 `ll-render`/`wgpu` 直接依赖一致：本体二进制
# 需要亲手构造 `TextRenderer`（`GpuResources::new`），不是只转发一个
# 现成实例。
ll-text = { path = "../ll-text" }
tracing = "0.1"

[dev-dependencies]
proptest.workspace = true
# 仅供 `tests/save_slots.rs` 直接改写存档头部 JSON——那些测试要造出
# 「本批次之前写出的老存档」（头部缺 `save_name` 键）与「两份时间戳拉开
# 的存档」，两件事都必须在**真实的存档文件字节**上做，不能靠夹具伪造。
# 版本与 `ll-content` 那份一致，避免同一个 crate 在工作区里被解析成两份。
serde_json = "1"
# 2026-08-29 批次 13：`image` 随三个 preview example 一并移除——它此前
# 的唯一用途是把真实图集的像素拼成 `tests/visual/*.png` 那三张给人看的
# 预览图。三张图本身保留，只是暂时没有生产者，见
# `crates/ll-game/tests/visual/README.md`。
