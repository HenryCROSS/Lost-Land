name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 双平台矩阵是硬要求：规格 §14.4 要求同一种子在 Windows 与 Linux
  # 上产出逐位相同的世界哈希。单平台 CI 无法发现确定性被破坏。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: bash scripts/ci/check_fmt.sh
      - name: Clippy
        run: bash scripts/ci/check_clippy.sh
      - name: 测试
        run: bash scripts/ci/run_tests.sh
      # 本步骤的前身是「运行验收 demo」：`cargo test`/`cargo clippy
      # --all-targets` 都只**编译** example、不运行它的 `main()`，而
      # 验收断言恰恰全在 `main()` 里——2026-08 的实例是
      # `p5_save_acceptance` 在主干上恒定 panic 了几个批次，CI 却一直
      # 全绿。2026-08-29 项目所有者裁定去掉 `examples/`（ADR 0030），
      # 那两个无头 demo 的断言已搬进
      # `crates/ll-content/tests/{save_acceptance,gameplay_acceptance}.rs`，
      # 由上一步的 `cargo test --workspace` 直接执行，「藏在 main() 里
      # 没人跑的断言」这个失败模式在结构上不再存在。
      #
      # 留下来的是前身那条完整性检查的收紧版：**一个 example target 都
      # 不许有**。删掉这道门禁等于把「不许悄悄加回来」这条保护一起删掉。
      #
      # 放在 `test` job 而不是新开一个 job：这里 workspace 已经编译并
      # 缓存好了，跑一次 `cargo metadata` 的边际成本可以忽略。
      - name: 禁止 example target（2026-08-29 所有者裁定，ADR 0030）
        run: bash scripts/ci/check_no_examples.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: 许可证与安全公告扫描
        run: bash scripts/ci/check_licenses.sh

  # 规格 §7.1 明写「此项由 CI 静态检查强制」，但门禁一直没有真正实现
  # （见 knowledge/handoff/p2-to-p3.md 第五节）。补上它：环面世界里手写
  # 欧氏距离是极难定位的一类缺陷——代码看起来能跑、单测也未必会红，
  # 只在两点恰好跨南北或东西接缝时才会算出一条绕了半个世界的错误
  # 「最短路」，因为普通 `sqrt(dx²+dy²)` 不知道世界在边界会绕回。
  # `TorusSize::chebyshev`/`squared_euclidean`/`delta`（见
  # crates/ll-core/src/torus.rs）已经处理了绕接缝取最短位移这件事，
  # 手写距离公式应一律改用它们。
  no-manual-euclidean-distance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止手写欧氏距离
        shell: bash
        run: bash scripts/ci/check_no_manual_euclidean_distance.sh

  # 本项目最顽固的失败模式：字段被声明、被存储、被序列化、被哈希、有测试
  # 守着往返——却没有任何游戏逻辑读它。已点名十九处，三个当前活着的例子
  # 是 `Agent.luck`（进 `WorldState::hash()`，全项目零逻辑读取）、
  # `RaceDef.darkvision_floor`（存取完整、两条测试断言往返正确，但没有
  # 任何函数实现它自己文档写的 `effective_light = max(...)`）、
  # `RuleModifier::Resistance`（能从 mod 声明、进内容值哈希，战斗里没人
  # 读）。共同点：它们各自都有测试，测试也都过——因为测的是存储往返或
  # 注册路径，不是效果；`cargo` 的 `dead_code` lint 抓不到，因为这些字段
  # 确实"被用了"（写进表、读出来、哈希、测试）。
  #
  # 本门禁对一份显式列出的"应当影响玩法的字段/枚举变体"清单
  # （`scripts/ci/check_field_consumers.py` 里的 `TARGET_TYPES`），检查
  # 每一个在"决策层"（`ll-sim/src/*.rs`、`ll-world/src/{fov,light}.rs`）
  # 是否至少有一处真实读取（区别于只在存储层/哈希/测试夹具里出现）。
  # 未接线的字段必须显式出现在同一个文件的 `EXEMPTIONS` 豁免清单里,写明
  # 理由与预期接线阶段——新增一个死字段会让这道门禁报错，逼一个决定：
  # 要么接上决策层逻辑，要么在 code review 里能看见的地方补一条豁免。
  # 直接阻断（不是 warn）：豁免清单在 `scripts/ci/` 内维护，不需要碰
  # `crates/**` 就能让门禁一开始就是绿的，没有"先 warn 免得 CI 一上来就
  # 红"的顾虑，见脚本头注释「warn 还是阻断」一节。
  field-consumer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 字段接线检查（声明但没有决策层消费者，阻断模式）
        run: python3 scripts/ci/check_field_consumers.py

  # 存档**主体**走 postcard（`ll-content/src/save_file.rs` 里的
  # `postcard::to_allocvec(world)`），那是 non-self-describing 的二进制
  # 格式——字节流里没有字段名，反序列化按声明顺序逐字段吃字节。两条后果：
  # `#[serde(default)]` 在这条路上**完全是空操作**；新字段若不在结构体
  # 末尾，后续字段的字节会被错位读成**合法值**（静默数据损坏，没有任何
  # 东西会报错）。
  #
  # 这个仓库已经犯过两次——`Agent::gender` 与 `GroundItemStack::placed`
  # 都往主体加了字段、都只加了 `#[serde(default)]`、都没有递增
  # `CURRENT_SCHEMA_VERSION`；两批各自的"老存档读得回来"测试走的是
  # `serde_json::Value`（自描述格式，`serde(default)` 在那里确实生效），
  # 于是全绿，却一个字节都没碰到真正的 postcard 主体那条路。
  #
  # 本门禁从 `WorldState` 出发机械求出"会被序列化进主体的类型闭包"
  # （闭包多大、含哪些类型跑 `--dump` 就是答案，这里刻意不抄一份会漂移
  # 的副本），把每个类型的线格式形状记进一份**由脚本自己
  # 生成**的快照 `scripts/ci/save_body_shape.json`，强制形状变化与
  # `CURRENT_SCHEMA_VERSION` 递增同批发生。刻意不维护任何手写类型清单
  # ——本仓库最稳定的缺陷来源就是"把真相源之外的副本当判据"
  # （`atlas_coverage.rs` 的手写地形清单、交接文档里的常量表、`skin.rs`
  # 查裸贴图名），门禁自己不能是第四个。已知局限与豁免机制见脚本头注释。
  save-schema-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 存档主体形状 ↔ schema 版本联动检查（阻断模式）
        run: python3 scripts/ci/check_save_schema_version.py

  # 规格 §14.5 要求"行覆盖率 ≥ 80%，核心 crate（ll-core/ll-sim/ll-world）
  # ≥ 90%"，但 `cargo-llvm-cov` 从未在本项目任何环境安装或运行过——不是
  # "曾经达标后来退化"，是从 P0 到现在都不知道真实数字。没有这道门禁，
  # 一段"调用了但没有任何断言"的空转测试可以无限混进代码库把覆盖率数字
  # 撑高却什么都没测，而覆盖率真正下降时也没有任何东西会拦、会告诉你。
  #
  # 阈值不是规格原文的 80%/90%，是棘轮阈值：只许调高，不许调低。理由见
  # scripts/ci/check_coverage.sh 头部注释——2026-08-17 首次在本项目实测，
  # workspace 行覆盖率 79.71%、核心三个 crate 合计 96.85%。一上来就把阈值
  # 设成 80%，若因为运行间的正常抖动差一点点没达标，团队第一反应通常是
  # 关掉这项检查而不是立刻补测试，那就等于这道门禁从未存在过；设成"当前
  # 真实值向下取整、留出抖动余量"则今天就能生效，且从此不会退步——能
  # 生效的低阈值胜过被关掉的高阈值。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: 覆盖率门禁（棘轮阈值，只许调高不许调低，见脚本头注释）
        run: bash scripts/ci/check_coverage.sh

  # 规格 §11.3："代码中不得出现任何硬编码的用户可见字符串，由 CI 检查
  # 强制"。项目目前还没有 `ll-ui`、没有任何 `.ftl` 本地化文件，风险现在
  # 是潜在的而非现实的——但风险会在 UI 层落地、菜单文案第一次被写进代码
  # 的那一刻突然出现。到那时如果这道检查还不存在，第一批硬编码字符串会
  # 在无人察觉的情况下进入代码库，往后每一条新字符串都只能靠人眼在
  # review 里揪，而字符串字面量恰恰是 review 里最容易被漏看的一类改动
  # （它不像逻辑错误那样会让测试变红）。现在先把检查骨架和豁免约定定下
  # 来，好过等第一批硬编码字符串已经进了代码库之后再回头补规则。
  #
  # 当前是 warn 模式，不阻断合并：脚本 2026-08-17 在本代码库实测命中 19
  # 处，逐条核实后全部是内部错误类型 Display/Err 构造里的中文诊断文案，
  # 与 `crates/ll-core/src/error.rs` 里 `CoreError::Display` 的先例（该处
  # 注释明确写"此处文案面向开发者与日志，不面向玩家，故不走 i18n"）是
  # 同一类东西，只是还没有补上同款的 `// i18n-exempt` 豁免标记。给这些
  # 位置补标记属于 `crates/**` 源码改动，不在本次 CI 门禁补齐任务的
  # 授权范围内。一旦标记补上，或者 `ll-ui`/i18n 机制真正落地，请把下面
  # 这一步改成 `python3 scripts/ci/check_i18n_strings.py --strict`——不要
  # 一直留在 warn 模式，那样这道门禁就只是摆设。
  no-hardcoded-i18n-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 硬编码用户可见字符串扫描（当前 warn 模式，见脚本头注释）
        run: python3 scripts/ci/check_i18n_strings.py

  # 规格 §13："代码卫生（持续执行）……文档与代码不一致即视为缺陷。"
  # 这两步各自覆盖一类机器能查的"文档与代码/文件系统不一致"：
  #
  # 1. `cargo doc` 断链——历史上真实出现过（见提交记录里
  #    `crates/ll-render/src/atlas.rs`/`batch.rs` 指向不存在或不可见条目
  #    的 intra-doc link）。这类问题 `clippy` 与 `cargo test` 都不检查，
  #    只能靠人工点开每一条文档链接核实，代码规模变大后必然会漏、会
  #    积累一整个项目周期无人发现。`rustdoc::private_intra_doc_links`
  #    （公开文档链到私有项）单独降级为警告：这是可见性设计问题，不是
  #    真正的死链——链接目标确实存在，只是暂时不可见，调整 `pub` 或加
  #    `--document-private-items` 就能让它消失，噪音大、价值低。真正的
  #    `rustdoc::broken_intra_doc_links`（链接目标根本不存在）仍然阻断，
  #    这才是"断链"本体。
  # 2. Markdown 死链——`knowledge/`、`docs/` 里指向不存在文件的相对链接，
  #    同样没有任何现有工具检查，只能靠人工点开。
  docs-and-links:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -A rustdoc::private_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 文档断链检查（真正的断链阻断，公开链到私有项仅警告）
        run: bash scripts/ci/check_doc_links.sh
      - name: Markdown 死链检查（docs/、knowledge/）
        run: python3 scripts/ci/check_markdown_links.py
