name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 双平台矩阵是硬要求：规格 §14.4 要求同一种子在 Windows 与 Linux
  # 上产出逐位相同的世界哈希。单平台 CI 无法发现确定性被破坏。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: 许可证与安全公告扫描
        run: cargo deny check

  # 规格 §7.1 明写「此项由 CI 静态检查强制」，但门禁一直没有真正实现
  # （见 knowledge/handoff/p2-to-p3.md 第五节）。补上它：环面世界里手写
  # 欧氏距离是极难定位的一类缺陷——代码看起来能跑、单测也未必会红，
  # 只在两点恰好跨南北或东西接缝时才会算出一条绕了半个世界的错误
  # 「最短路」，因为普通 `sqrt(dx²+dy²)` 不知道世界在边界会绕回。
  # `TorusSize::chebyshev`/`squared_euclidean`/`delta`（见
  # crates/ll-core/src/torus.rs）已经处理了绕接缝取最短位移这件事，
  # 手写距离公式应一律改用它们。
  no-manual-euclidean-distance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止手写欧氏距离
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r -d '' file; do
            while IFS=: read -r line_no content; do
              trimmed="$(printf '%s' "$content" | sed -e 's/^[[:space:]]*//')"
              case "$trimmed" in
                //*) continue ;;
              esac
              echo "::error file=$file,line=$line_no::检测到疑似手写欧氏距离：${content}。环面世界必须改用 TorusSize 的 chebyshev/squared_euclidean/delta（crates/ll-core/src/torus.rs），不得手写 sqrt/powi(2)/hypot 计算距离。"
              violations=$((violations + 1))
            done < <(grep -nE '\bsqrt\(|\.powi\(2\)|\bhypot\(' "$file" || true)
          done < <(find crates -type f -name '*.rs' -print0)
          if [ "$violations" -gt 0 ]; then
            echo "共发现 $violations 处疑似手写欧氏距离，见上方逐条标注。"
            exit 1
          fi
          echo "未发现手写欧氏距离。"
