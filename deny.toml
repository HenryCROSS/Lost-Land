# 许可证门禁。规格 §3 要求全传递依赖树只允许宽松许可、无 GPL、无付费
# ——出现清单外许可证即构建失败，避免项目走到一半才发现某个深层依赖是
# GPL，被迫大改。

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    # MPL-2.0 曾在 2026-08-18 由项目所有者裁定加入白名单，理由见
    # knowledge/licenses/2026-08-18-steel-core-scan.md「甲案」一节：
    # steel-core（脚本引擎）默认 feature 传递依赖 im-rc/sized-chunks/
    # bitmaps 三个 MPL-2.0 库。脚本系统整体拆除后这条依赖链不存在了，
    # 白名单里也就不再需要 MPL-2.0——重新收紧，而不是留着一条没有
    # 消费者的豁免（留着的代价是：将来某个新依赖悄悄带进 MPL-2.0，
    # 门禁不会响）。
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# 以下这条是 unmaintained（作者停止维护），不是已知漏洞——与上面的
# 许可证问题性质不同，单独处理，不与许可证豁免混在一起。
# 重新评估触发条件：它若升级成真实安全公告（RUSTSEC 的 advisory 类型
# 从 unmaintained 变成 vulnerability），必须立刻从这份 ignore 列表
# 移除并重新评估，不能到时候顺手继续忽略。
#
# 此处曾另有四条（bincode/bitmaps/im-rc/sized-chunks），全部来自
# steel-core 的依赖链，详见
# knowledge/licenses/2026-08-18-steel-core-scan.md。脚本系统拆除后
# 那条依赖链不存在了，四条豁免一并删除。
ignore = [
    # 2026-08-18 追加：ttf-parser 0.25.1，经 cosmic-text → fontdb 0.23.0 传入，
    # 作者标记 unmaintained，无安全升级路径。同属 unmaintained 而非漏洞，
    # 按上述同一条纪律处理；触发条件相同。替代方案（换掉 cosmic-text）代价
    # 远大于收益——它是本项目唯一可行的 CJK 排版方案，见
    # knowledge/pipelines/text-and-font-rendering.md。
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1——cosmic-text/fontdb 的字体解析依赖，作者停止维护
]
