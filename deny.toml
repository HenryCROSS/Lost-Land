# 许可证门禁。规格 §3 要求全传递依赖树只允许宽松许可，
# 出现清单外许可证即构建失败——避免项目走到一半才发现
# 某个深层依赖是 GPL，被迫大改。

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
